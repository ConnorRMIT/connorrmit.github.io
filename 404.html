<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<meta name="robots" content="index, follow">
	<meta name="description" content="404 Page and 404 Gallery for the Edugator rewrite project">
	<meta property="og:description" content="404 Page and 404 Gallery for the Edugator rewrite project">
	<title>404 Page Not Found Gallery</title>
	<meta property="og:title" content="404 Page Not Found Gallery">
	<link rel="stylesheet" href="./styles/404.css">
	<link rel="icon" href="./images/favicon/favicon.ico" type="image/x-icon">
</head>

<body>
	<h1>404 Page Gallery</h1>
	<div class="gallery">
		<div class="click-zoom">
			<label>
				<input type="checkbox" />
				<div class="picture-frame">
					<img src="./images/gallery/EdugatorNotFound.png"
						alt="Image of hand drawn alligator with the text '404 Error: Page Not Found'. The alligator is saying 'y my code no work'. A graphic design is my passion is displayed in the bottom right corner.">
				</div>
				<p class="plaque">Original 404 Image</p>
			</label>
		</div>
		<div class="click-zoom">
			<label>
				<input type="checkbox" />
				<div class="picture-frame">
					<img src="./images/gallery/EdugatorNotFoundSaba.png"
						alt="A poorly edited version of the 'several people are typing' meme has been added to the bottom left corner that says 'Saba Shaw is typing...' There is a 'rm -rf node_modules' added next to the alligator and Daniel's git rebase issues are placed around the edge of the image.">
				</div>
				<p class="plaque">After the Saba Shaw is typing incident where Daniel messed up a rebase really badly
				</p>
			</label>
		</div>
		<div class="click-zoom">
			<label>
				<input type="checkbox" />
				<div class="picture-frame">
					<img src="./images/gallery/EdugatorNotFoundVicNoRMIT.png"
						alt="Text that says 'The order of presentations will be the order in which the files arrive in the presentation folder.' is present to the right of the alligator. This comes from the programming project 1 week 9 presentation announcement, indicating that the team had to wait a really long time.">
				</div>
				<p class="plaque">Text from the presentation announcement (We were scheduled first, we presented 7th
					after class)</p>
			</label>
		</div>
		<div class="click-zoom">
			<label>
				<input type="checkbox" />
				<div class="picture-frame">
					<img src="./images/gallery/EdugatorNotFoundVic.png"
						alt="There are stars near the top left of the image, they previously said 'UF' for University of Florida, however they now also say RMIT.">
				</div>
				<p class="plaque">The same announcement image, but with RMIT added to the stars along side Univeristy of
					Florida</p>
			</label>
		</div>
		<div class="click-zoom">
			<label>
				<input type="checkbox" />
				<div class="picture-frame">
					<img src="./images/gallery/EdugatorNotFoundAm.png"
						alt="The famous hate passage from 'I have no mouth, and I must scream' has been added as a reflection in the water.">
				</div>
				<p class="plaque">The passage from 'I have no mouth, and I must scream'. Based on Saba saying 'Hate' in
					response to the gates of hell opening</p>
			</label>
		</div>
		<div class="click-zoom">
			<label>
				<input type="checkbox" />
				<div class="picture-frame">
					<img src="./images/gallery/EdugatorNotFoundAllotment.png"
						alt="A javascript error that reads 'Prop sizes is deprecated. Please use defaultSizes instead. (2420 repeats)'.">
				</div>
				<p class="plaque">This error that was added refers to a deprecated prop used with Allotments in the
					problem page. Two of these would appear every time you wrote a character in the code editor</p>
			</label>
		</div>
	</div>
</body>

</html>
